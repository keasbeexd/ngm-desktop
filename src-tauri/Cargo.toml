[package]
name = "ngm-desktop"
version = "0.2.6"
description = "NGM Desktop: the desktop app for NGM Peon and the Nootropic Guild Manager addon"
authors = ["Marc @keasbeexd"]
license-file = "../LICENSE"
repository = "https://github.com/keasbeexd/ngm-desktop"
edition = "2021"
publish = false

[lib]
name = "ngm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Exact versions, each at least two weeks old when chosen (2026-11-16).
[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-dialog = "=2.8.4"
keyring = "=4.2.0"
# the system's own TLS and certificates (Schannel, Secure Transport, OpenSSL)
reqwest = { version = "=0.13.5", default-features = false, features = ["default-tls", "json", "http2", "query"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
notify = "=8.2.1"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-opener = "=2.7.2"
# NGM Desktop's own updates: only files signed with our update key
tauri-plugin-updater = "=2.14.1"
# NGM updates: GitHub release zips, checked against their SHA-256
zip = { version = "=9.2.2", default-features = false, features = ["deflate"] }
sha2 = "=0.11.1"
# only to tell whether WoW is running (process names), nothing else
sysinfo = { version = "=0.40.1", default-features = false, features = ["system"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Windows and macOS: start with the computer (Linux writes its own login
# entry, src/launcher.rs, because an AppImage's own path changes every run)
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "=2.7.0"
