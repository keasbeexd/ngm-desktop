# Announces a release on Discord when it's published (not when it's tagged:
# the tag only makes a draft, and a draft can't be downloaded yet). Posts the
# version and its CHANGELOG.md section to the release channel
# (DISCORD_RELEASE_WEBHOOK, no ping); feature releases (x.y.0) also to
# #announcements (DISCORD_ANNOUNCE_WEBHOOK, pinging the role in the
# DISCORD_ANNOUNCE_ROLE_ID variable). Missing secrets just skip their post.
#
# Security: runs only when a release is published (never for pull requests),
# with read-only access; the action is pinned to an exact commit.
name: Announce

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Announce on Discord
        env:
          TAG: ${{ github.event.release.tag_name }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          DISCORD_ANNOUNCE_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
          DISCORD_ANNOUNCE_ROLE_ID: ${{ vars.DISCORD_ANNOUNCE_ROLE_ID }}
        run: python3 .github/scripts/discord_release.py
